specVersion: "0.1"
kind: QualityRequirement
metadata:
  id: api-availability
  name: API availability
spec:
  statement: The payment API must achieve at least 99.95% monthly availability.
  priority: critical
  qualityMeasures:
    - qualityMeasure: availability
      target:
        operator: greaterThanOrEqual
        value: 99.95
        unit: percent
