specVersion: "0.1"
kind: Stage
metadata:
  id: continuous-integration
  name: Continuous integration
spec:
  type: continuous-integration
  activities:
    - linter
    - build
    - unit-tests
    - integration-tests
    - static-analysis
    - vulnerability-scan
    - secrets-scan
    - artifact-generation
  dependsOn:
    - code-review
  owner: software-engineer
  gates:
    - ci-quality-gate
  reports:
    - automated-test-report
