specVersion: "0.1"
kind: QualityContract
metadata:
  id: payment-api
  name: Payment API
  description: Minimal Quality Contract for a payment service.

spec:
  documentation:
    - technical-design
  quality:
    - characteristic: reliability
      subcharacteristics:
        - subcharacteristic: availability
          requirements:
            - api-availability
    - characteristic: maintainability
      subcharacteristics:
        - subcharacteristic: testability
          requirements:
            - unit-test-coverage-requirement
  metrics:
    - unit-test-coverage
  workflow: standard-release

providers:
  workManagement:
    provider: github
    config:
      owner: duanribeiro
      project: Payment API Quality
      ownerType: user
    description: GitHub Projects v2 work management board.

  sourceControl:
    provider: github
    config:
      owner: duanribeiro
      repository: payment-api
      visibility: public
      members:
        - role: software-engineer
          usernames: [duanribeiro]
          permission: push
    description: Enforces the repository source-control policy.
