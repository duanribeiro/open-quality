kind: QualityContract

metadata:
  id: payment-api
  name: Payment API
  description: Minimal Quality Contract for a payment service.

team:
  - email: engineer@example.com
    roles:
      - software-engineer
  - email: lead@example.com
    roles:
      - quality-lead
      - engineering-manager

docs:
  - technical-design

quality:
  characteristics:
    - characteristic: reliability
      subcharacteristics:
        - subcharacteristic: availability
          requirements:
            - api-availability
    - characteristic: maintainability
      subcharacteristics:
        - subcharacteristic: testability
          requirements:
            - unit-test-coverage-requirement

workManagement:
  workflow: standard-release
  provider: gitlab
  config:
    owner: duan.ribeiro1
    group: personal-group110747
    project: Payment API Quality
    ownerType: user
  description: GitLab group Issue Board work management.

sourceControl:
  provider: gitlab
  config:
    owner: duan.ribeiro1
    repository: payment-api
    visibility: public
  description: Enforces the repository source-control policy.
