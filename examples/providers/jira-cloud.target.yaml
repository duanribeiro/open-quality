provider: jira-cloud
description: Jira Cloud target for the minimal payment API contract.
config:
  baseURL: https://example.atlassian.net
  projectKey: PAY
  projectTemplateKey: com.pyxis.greenhopper.jira:gh-kanban-template
  issueTypeName: Task
  members:
    - role: software-engineer
      emails: [engineer@example.com]
      jiraProjectRole: Members
    - role: quality-lead
      emails: [quality@example.com]
      jiraProjectRole: Members
  kanban:
    columns: [To do, In progress, Done]
