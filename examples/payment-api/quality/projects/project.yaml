specVersion: "0.1"
kind: Project
metadata:
  id: payment-api
  name: Payment API
  description: Reference contract for a payment service release.
spec:
  requirements: [api-availability, api-latency, no-critical-vulnerabilities]
  workflow: standard-release
  gates: [ci-gate, staging-gate]
  metrics: [availability, latency-p95, test-pass-rate, code-coverage, critical-vulnerabilities]
  documentation: [technical-design]
  reports: [automated-test-report, security-report]
  roles: [software-engineer, quality-lead, engineering-manager]
  approvalPolicies: [production-release-approval]
