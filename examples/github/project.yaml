specVersion: "0.1"
kind: Project
metadata: {id: inventory-api, name: Inventory API}
spec:
  workflow: delivery
  quality:
    - characteristic: reliability
      subcharacteristics:
        - subcharacteristic: availability
          requirements: [api-availability]
providers:
  sourceControl:
    provider: github
    config:
      owner: example-organization
      repository: inventory-api
      visibility: private
      members:
        - role: software-engineer
          usernames: [example-engineer]
          permission: push
