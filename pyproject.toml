[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-quality-cli"
version = "0.1.0"
description = "Command-line interface for the Open Quality 0.1 specification"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]
keywords = ["quality", "quality-as-code", "software-quality", "open-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/duanribeiro/open-quality"
Repository = "https://github.com/duanribeiro/open-quality"
Issues = "https://github.com/duanribeiro/open-quality/issues"

[project.optional-dependencies]
dev = ["black>=24.0,<26"]

[project.scripts]
oq = "cli.cli:main"

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.setuptools.packages.find]
include = ["cli*"]
