[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-quality-cli"
version = "0.1.0"
description = "Command-line interface for the Open Quality 0.1 specification"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["black>=24.0,<26"]

[project.scripts]
oq = "cli.cli:main"

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.setuptools.packages.find]
include = ["cli*"]
